    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // ==========================================
    // UTILITY UNTUK REKAP & PENILAIAN
    // ==========================================
    function calculateResults(questions, userAnswers) {
      let totalWeightedScore = 0;
      let totalMaxScore = questions.length;
      let essaySummaryParts = [];
      let itemAnalysisParts = [];

      questions.forEach((q) => {
        const uAns = userAnswers[q.id];
        const originalId = q.id;

        if (q.type === 'mc') {
          const selected = uAns || '';
          if (selected === q.correct) {
            totalWeightedScore += 1;
            itemAnalysisParts.push(`Soal ${originalId}: BENAR`);
          } else if (selected === '') {
            itemAnalysisParts.push(`Soal ${originalId}: KOSONG`);
          } else {
            itemAnalysisParts.push(`Soal ${originalId}: SALAH (Pilih: [${selected}], Kunci: [${q.correct}])`);
          }
        } 
        else if (q.type === 'complex') {
          const selectedArr = Array.isArray(uAns) ? uAns.sort() : [];
          const correctArr = [...q.correct].sort();
          
          if (selectedArr.length === 0) {
            itemAnalysisParts.push(`Soal ${originalId}: KOSONG`);
          } else if (JSON.stringify(selectedArr) === JSON.stringify(correctArr)) {
            totalWeightedScore += 1;
            itemAnalysisParts.push(`Soal ${originalId}: BENAR`);
          } else {
            itemAnalysisParts.push(`Soal ${originalId}: SALAH (Pilih: [${selectedArr.join(',')}], Kunci: [${correctArr.join(',')}])`);
          }
        } 
        else if (q.type === 'short_answer') {
          const textVal = (uAns || '').trim();
          const expected = (q.correctAnswer || '').trim();
          
          if (!textVal) {
            itemAnalysisParts.push(`Soal ${originalId}: KOSONG`);
          } else if (textVal.toLowerCase() === expected.toLowerCase()) {
            totalWeightedScore += 1;
            itemAnalysisParts.push(`Soal ${originalId}: BENAR`);
          } else {
            itemAnalysisParts.push(`Soal ${originalId}: SALAH (Pilih: [${textVal}], Kunci: [${expected}])`);
          }
        } 
        else if (q.type === 'matching') {
          const matchObj = uAns || {};
          let correctPremises = 0;
          let subDetails = [];

          q.premises.forEach((prem, idx) => {
            const studentChoice = matchObj[idx] || '';
            const isRight = studentChoice === prem.correctKey;
            if (isRight) correctPremises += 1;

            const resStr = isRight 
              ? `Premis${idx+1}=${studentChoice} (BENAR)`
              : `Premis${idx+1}=${studentChoice || 'KOSONG'} (SALAH, Kunci: ${prem.correctKey})`;
            subDetails.push(resStr);
          });

          const proportion = correctPremises / q.premises.length;
          totalWeightedScore += proportion;

          itemAnalysisParts.push(`Soal ${originalId} (Menjodohkan): [${subDetails.join(' | ')}]`);
        } 
        else if (q.type === 'essay') {
          const essayText = (uAns || '').trim();
          if (essayText) {
            essaySummaryParts.push(`Soal ${originalId}: ${essayText}`);
            itemAnalysisParts.push(`Soal ${originalId} (Esai): [${essayText}]`);
          } else {
            essaySummaryParts.push(`Soal ${originalId}: [KOSONG]`);
            itemAnalysisParts.push(`Soal ${originalId} (Esai): [KOSONG]`);
          }
        }
      });

      const finalScore = Math.round((totalWeightedScore / totalMaxScore) * 100);
      const jawabanEsaiString = essaySummaryParts.length > 0 ? essaySummaryParts.join('\n') : 'Tidak ada soal esai.';
      const rincianJawabanString = itemAnalysisParts.join(' | ');

      return {
        score: finalScore,
        jawabanEsai: jawabanEsaiString,
        rincianJawaban: rincianJawabanString
      };
    }

    // ==========================================
    // MAIN APP COMPONENT
    // ==========================================
    function App() {
      // User & Exam State
      const [studentData, setStudentData] = useState({
        nama: '',
        kelas: EXAM_CONFIG.grade,
        tanggal: new Date().toISOString().split('T')[0]
      });

      const [examState, setExamState] = useState('LOGIN'); // 'LOGIN', 'RESTORE_PROMPT', 'EXAM', 'SUBMITTED'
      const [preparedQuestions, setPreparedQuestions] = useState([]);
      const [userAnswers, setUserAnswers] = useState({});
      const [currentIndex, setCurrentIndex] = useState(0);
      const [secondsLeft, setSecondsLeft] = useState(EXAM_CONFIG.durationMinutes * 60);
      const [violations, setViolations] = useState(0);

      // Modal States
      const [showViolationModal, setShowViolationModal] = useState(false);
      const [showConfirmModal, setShowConfirmModal] = useState(false);
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [submitResult, setSubmitResult] = useState(null);

      // 1. Inisialisasi Soal & Acak Opsi Pilihan Ganda (Fisher-Yates)
      const initExamQuestions = useCallback(() => {
        const shuffledQ = shuffleArray(rawQuestionsData).map((q) => {
          let newQ = { ...q };
          if (q.type === 'mc' || q.type === 'complex') {
            newQ.options = shuffleArray(q.options);
          }
          return newQ;
        });
        return shuffledQ;
      }, []);

      // 2. Cek Sesi Ujian di LocalStorage saat komponen pertama kali dimuat
      useEffect(() => {
        const savedData = localStorage.getItem(EXAM_CONFIG.storageKey);
        if (savedData) {
          try {
            const parsed = JSON.parse(savedData);
            if (parsed && parsed.studentData && parsed.preparedQuestions) {
              setExamState('RESTORE_PROMPT');
            }
          } catch (e) {
            console.error("Gagal parsing LocalStorage data", e);
          }
        }
      }, []);

      // 3. Fungsi Lanjutkan Ujian atau Mulai Ulang
      const handleRestoreExam = () => {
        const savedData = JSON.parse(localStorage.getItem(EXAM_CONFIG.storageKey));
        setStudentData(savedData.studentData);
        setPreparedQuestions(savedData.preparedQuestions);
        setUserAnswers(savedData.userAnswers || {});
        setSecondsLeft(savedData.secondsLeft ?? (EXAM_CONFIG.durationMinutes * 60));
        setViolations(savedData.violations || 0);
        setExamState('EXAM');
      };

      const handleRestartExam = () => {
        localStorage.removeItem(EXAM_CONFIG.storageKey);
        setExamState('LOGIN');
      };

      // 4. Auto-Save ke LocalStorage secara Real-time saat Pengerjaan
      useEffect(() => {
        if (examState === 'EXAM' && preparedQuestions.length > 0) {
          const payload = {
            studentData,
            preparedQuestions,
            userAnswers,
            secondsLeft,
            violations
          };
          localStorage.setItem(EXAM_CONFIG.storageKey, JSON.stringify(payload));
        }
      }, [examState, preparedQuestions, userAnswers, secondsLeft, violations]);

      // 5. Timer Hitung Mundur Ujian
      useEffect(() => {
        if (examState !== 'EXAM') return;
        if (secondsLeft <= 0) {
          handleAutoSubmit('Waktu Ujian telah habis!');
          return;
        }

        const timer = setInterval(() => {
          setSecondsLeft((prev) => prev - 1);
        }, 1000);

        return () => clearInterval(timer);
      }, [examState, secondsLeft]);

      // 6. Pengiriman Data Ujian (Submit)
      const submitExam = useCallback(async (keteranganParam) => {
        setIsSubmitting(true);
        const { score, jawabanEsai, rincianJawaban } = calculateResults(rawQuestionsData, userAnswers);

        const payload = {
          nama: studentData.nama,
          kelas: studentData.kelas,
          tanggal: studentData.tanggal,
          nilai: score,
          pelanggaran: violations,
          keterangan: keteranganParam || 'Selesai Tepat Waktu',
          jawabanEsai: jawabanEsai,
          rincianJawaban: rincianJawaban
        };

        try {
          // Kirim ke Google Apps Script backend menggunakan POST mode no-cors
          await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'text/plain' },
            body: JSON.stringify(payload)
          });

          localStorage.removeItem(EXAM_CONFIG.storageKey);
          setSubmitResult(payload);
          setExamState('SUBMITTED');
        } catch (err) {
          console.error("Error submitting exam:", err);
          // Tetap tampilkan hasil walaupun offline/no-cors
          localStorage.removeItem(EXAM_CONFIG.storageKey);
          setSubmitResult(payload);
          setExamState('SUBMITTED');
        } finally {
          setIsSubmitting(false);
          setShowConfirmModal(false);
          setShowViolationModal(false);
        }
      }, [studentData, userAnswers, violations]);

      const handleAutoSubmit = useCallback((keterangan) => {
        submitExam(keterangan);
      }, [submitExam]);

      // 7. Deteksi Anti-Cheat (Visibility & Fullscreen)
      useEffect(() => {
        if (examState !== 'EXAM') return;

        const handleSecurityViolation = () => {
          setViolations((prevCount) => {
            const nextCount = prevCount + 1;
            if (nextCount === 1) {
              setShowViolationModal(true);
            } else if (nextCount >= 2) {
              handleAutoSubmit('Diskualifikasi: Pelanggaran Keamanan Berulang (Pindah Tab/Keluar Fullscreen)');
            }
            return nextCount;
          });
        };

        const onVisibilityChange = () => {
          if (document.hidden) {
            handleSecurityViolation();
          }
        };

        const onFullscreenChange = () => {
          if (!document.fullscreenElement) {
            handleSecurityViolation();
          }
        };

        const preventCopyPasteSelect = (e) => {
          const isInput = ['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName);
          if (!isInput) {
            e.preventDefault();
          }
        };

        document.addEventListener('visibilitychange', onVisibilityChange);
        document.addEventListener('fullscreenchange', onFullscreenChange);
        document.addEventListener('contextmenu', preventCopyPasteSelect);
        document.addEventListener('copy', preventCopyPasteSelect);
        document.addEventListener('cut', preventCopyPasteSelect);
        document.addEventListener('paste', preventCopyPasteSelect);

        return () => {
          document.removeEventListener('visibilitychange', onVisibilityChange);
          document.removeEventListener('fullscreenchange', onFullscreenChange);
          document.removeEventListener('contextmenu', preventCopyPasteSelect);
          document.removeEventListener('copy', preventCopyPasteSelect);
          document.removeEventListener('cut', preventCopyPasteSelect);
          document.removeEventListener('paste', preventCopyPasteSelect);
        };
      }, [examState, handleAutoSubmit]);

      // 8. Handle Mulai Ujian & Fullscreen
      const handleStartExam = (e) => {
        e.preventDefault();
        if (!studentData.nama.trim()) {
          alert('Silakan masukkan nama lengkap Anda.');
          return;
        }

        // Request Fullscreen
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        }

        const questions = initExamQuestions();
        setPreparedQuestions(questions);
        setSecondsLeft(EXAM_CONFIG.durationMinutes * 60);
        setViolations(0);
        setUserAnswers({});
        setExamState('EXAM');
      };

      // Handler Ubah Jawaban
      const handleAnswerChange = (qId, val) => {
        setUserAnswers((prev) => ({
          ...prev,
          [qId]: val
        }));
      };

      const currentQuestion = preparedQuestions[currentIndex];

      // Format sisa waktu (MM:SS)
      const formatTime = (totalSeconds) => {
        const m = Math.floor(totalSeconds / 60);
        const s = totalSeconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      // ----------------------------------------
      // RENDER PAGE 1: MODAL RESTORE SESSION

      if (examState === 'RESTORE_PROMPT') {
        return (

                <Icon name="refresh" className="w-10 h-10" />
              </div>
              <div className="space-y-2">
                <h2 className="text-2xl font-extrabold text-white">Sesi Ujian Tersimpan!</h2>
                <p className="text-slate-400 text-sm">

                </p>
              </div>
              <div className="space-y-3 pt-2">
                <button
                  onClick={handleRestoreExam}
                  className="w-full py-3.5 px-4 bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center justify-center space-x-2"
                >
                  <Icon name="check" className="w-5 h-5" />
                  <span>Lanjutkan Ujian</span>
                </button>
                <button
                  onClick={handleRestartExam}
                  className="w-full py-3 px-4 bg-slate-800 hover:bg-rose-950/50 text-rose-400 border border-rose-900/40 font-semibold rounded-xl transition-all"
                >
                  Mulai Ulang (Hapus Progres)
                </button>
              </div>
            </div>
          </div>
        );

      // ----------------------------------------

                  </div>
                </div>

                <div className="bg-slate-950/50 border border-amber-900/40 rounded-xl p-4 flex items-start space-x-3 text-amber-300/90 text-xs leading-relaxed">
                  <Icon name="warning" className="w-5 h-5 text-amber-400 shrink-0 mt-0.5" />
                  <div>
                    <span className="font-bold block text-amber-400 mb-0.5">Perhatian Penting:</span>
                    Saat menekan tombol <b>Mulai Ujian</b>, browser akan otomatis beralih ke mode Fullscreen. Dilarang menutup tab atau berpindah aplikasi selama ujian berlangsung.
                  </div>
                </div>

                <button
                  type="submit"
                  className="w-full py-4 px-6 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black text-lg rounded-xl shadow-lg shadow-cyan-900/30 transition-all transform active:scale-98 flex items-center justify-center space-x-2"
                >
                  <span>Mulai Ujian Sekarang</span>
                  <Icon name="right" className="w-5 h-5" />
                </button>
              </form>
            </div>
          </div>
        );
      }

      // ----------------------------------------
      // RENDER PAGE 3: HALAMAN HASIL / SUBMITTED
      // ----------------------------------------
      if (examState === 'SUBMITTED' && submitResult) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="max-w-xl w-full bg-slate-900/95 border border-slate-700 rounded-3xl p-8 shadow-2xl space-y-6 text-center">
              <div className="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto border-2 border-emerald-500/40">
                <Icon name="check" className="w-12 h-12" />
              </div>

              <div className="space-y-1">
                <h2 className="text-3xl font-black text-white">Ujian Berhasil Terkirim!</h2>
                <p className="text-slate-400 text-sm">Terima kasih telah menyelesaikan ujian ini secara jujur.</p>
              </div>

              <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 space-y-4 text-left">
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <span className="text-slate-400 text-sm">Nama Siswa:</span>
                  <span className="text-white font-bold">{submitResult.nama}</span>
                </div>
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <span className="text-slate-400 text-sm">Mata Pelajaran:</span>
                  <span className="text-cyan-400 font-bold">{EXAM_CONFIG.subject}</span>
                </div>
                <div className="flex justify-between items-center border-b border-slate-800 pb-3">
                  <span className="text-slate-400 text-sm">Status / Pelanggaran:</span>
                  <span className="text-amber-400 font-semibold">{submitResult.keterangan} ({submitResult.pelanggaran} Pelanggaran)</span>
                </div>
                <div className="flex justify-between items-center pt-2">
                  <span className="text-slate-300 font-bold text-lg">Nilai Otomatis:</span>
                  <span className="text-4xl font-black text-emerald-400 bg-emerald-950/60 border border-emerald-800/60 px-5 py-2 rounded-2xl">
                    {submitResult.nilai}
                  </span>
                </div>
              </div>

              <p className="text-slate-500 text-xs">
                Data jawaban Anda telah berhasil diarsipkan secara otomatis ke Server Nilai Guru.
              </p>
            </div>
          </div>
        );
      }

      // ----------------------------------------
      // RENDER PAGE 4: ANTARMUKA UJIAN (EXAM UI)
      // ----------------------------------------
      return (
        <div className="min-h-screen flex flex-col justify-between">
          {/* HEADER EXAM */}
          <header className="bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-30 px-4 py-3">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div>
                <h1 className="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-300">
                  {EXAM_CONFIG.subject}
                </h1>
                <p className="text-xs text-slate-400">
                  {EXAM_CONFIG.examType} — Kelas {EXAM_CONFIG.grade}
                </p>
              </div>

              {/* TIMER DISPLAY */}
              <div className="flex items-center space-x-4">
                <div className="bg-slate-950 border border-cyan-800/60 text-cyan-400 px-4 py-2 rounded-xl flex items-center space-x-2">
                  <Icon name="clock" className="w-5 h-5 animate-pulse" />
                  <span className="font-mono text-lg font-bold tracking-wider">{formatTime(secondsLeft)}</span>
                </div>

                {violations > 0 && (
                  <div className="hidden sm:flex items-center space-x-1 text-xs bg-rose-950/80 border border-rose-800 text-rose-300 px-3 py-2 rounded-xl">
                    <Icon name="warning" className="w-4 h-4" />
                    <span>Pelanggaran: {violations}/2</span>
                  </div>
                )}
              </div>
            </div>
          </header>

          {/* MAIN CONTENT AREA */}
          <main className="max-w-7xl mx-auto w-full p-4 flex-1 grid grid-cols-1 lg:grid-cols-3 gap-6 my-2">
            
            {/* LEFT / CENTER: QUESTION BOARD */}
            <div className="lg:col-span-2 bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-3xl p-6 flex flex-col justify-between shadow-xl min-h-[520px]">
              {currentQuestion && (
                <div className="space-y-6">
                  {/* QUESTION HEADER */}
                  <div className="flex items-center justify-between border-b border-slate-800 pb-3">
                    <span className="text-xs font-bold uppercase tracking-wider text-cyan-400 bg-cyan-950 px-3 py-1 rounded-lg border border-cyan-800/40">
                      Soal Nomor {currentIndex + 1} Dari {preparedQuestions.length}
                    </span>
                    <span className="text-xs text-slate-400 font-medium">
                      Tipe: {
                        currentQuestion.type === 'mc' ? 'Pilihan Ganda' :
                        currentQuestion.type === 'complex' ? 'Pilihan Ganda Kompleks' :
                        currentQuestion.type === 'short_answer' ? 'Isian Singkat' :
                        currentQuestion.type === 'matching' ? 'Menjodohkan' : 'Esai / Uraian'
                      }
                    </span>
                  </div>

                  {/* STIMULUS TEKS (JIKA ADA) */}
                  {currentQuestion.stimulus && (
                    <div className="bg-slate-950/90 border border-slate-800 rounded-2xl p-4 text-slate-200 text-sm leading-relaxed max-h-48 overflow-y-auto arabic-font text-2xl">
                      {currentQuestion.stimulus}
                    </div>
                  )}

                  {/* GAMBAR SOAL (JIKA ADA) */}
                  {currentQuestion.image && (
                    <div className="rounded-2xl overflow-hidden border border-slate-800 bg-slate-950 flex justify-center">
                      <img src={currentQuestion.image} alt="Gambar Soal" className="max-h-64 object-contain" />
                    </div>
                  )}

                  {/* QUESTION TEXT */}
                  <div className={`text-slate-100 font-semibold text-lg leading-relaxed ${currentQuestion.isArabic ? 'arabic-font text-2xl' : ''}`}>
                    {currentQuestion.text}
                  </div>

                  {/* INPUT JAWABAN BERDASARKAN TIPE SOAL */}
                  <div className="pt-2">
                    
                    {/* 1. PILIHAN GANDA (MC) */}
                    {currentQuestion.type === 'mc' && (
                      <div className={currentQuestion.hasImageOptions ? "grid grid-cols-1 md:grid-cols-2 gap-4" : "space-y-3"}>
                        {currentQuestion.options.map((opt) => {
                          const isSelected = userAnswers[currentQuestion.id] === opt.key;
                          return (
                            <button
                              key={opt.key}
                              onClick={() => handleAnswerChange(currentQuestion.id, opt.key)}
                              className={`w-full text-left p-4 rounded-2xl border transition-all flex items-start space-x-3 group ${
                                isSelected 
                                  ? 'bg-cyan-950/70 border-cyan-400 shadow-md ring-2 ring-cyan-400/30' 
                                  : 'bg-slate-950/50 border-slate-800 hover:border-slate-700 hover:bg-slate-800/40'
                              }`}
                            >
                              <span className={`w-7 h-7 rounded-full border flex items-center justify-center shrink-0 font-bold text-xs ${
                                isSelected ? 'bg-cyan-400 text-slate-950 border-cyan-400' : 'border-slate-600 text-slate-400'
                              }`}>
                                {opt.key}
                              </span>
                              <div className="flex-1 space-y-2">
                                {opt.image && (
                                  <img src={opt.image} alt={`Opsi ${opt.key}`} className="w-full h-36 object-cover rounded-xl border border-slate-700" />
                                )}
                                {opt.text && (
                                  <span className={`block text-slate-200 font-medium ${opt.isArabic ? 'arabic-font text-xl' : 'text-sm'}`}>
                                    {opt.text}
                                  </span>
                                )}
                              </div>
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {/* 2. PILIHAN GANDA KOMPLEKS (COMPLEX) */}
                    {currentQuestion.type === 'complex' && (
                      <div className="space-y-3">
                        <p className="text-xs text-amber-400 font-medium mb-2">* Centang beberapa opsi yang dianggap benar.</p>
                        {currentQuestion.options.map((opt) => {
                          const selectedArr = userAnswers[currentQuestion.id] || [];
                          const isChecked = selectedArr.includes(opt.key);

                          const toggleCheck = () => {
                            let updated = [...selectedArr];
                            if (isChecked) {
                              updated = updated.filter(k => k !== opt.key);
                            } else {
                              updated.push(opt.key);
                            }
                            handleAnswerChange(currentQuestion.id, updated);
                          };

                          return (
                            <button
                              key={opt.key}
                              onClick={toggleCheck}
                              className={`w-full text-left p-4 rounded-2xl border transition-all flex items-center space-x-3 ${
                                isChecked 
                                  ? 'bg-cyan-950/70 border-cyan-400 shadow-md' 
                                  : 'bg-slate-950/50 border-slate-800 hover:border-slate-700'
                              }`}
                            >
                              <div className={`w-6 h-6 rounded-md border flex items-center justify-center shrink-0 ${
                                isChecked ? 'bg-cyan-400 border-cyan-400 text-slate-950' : 'border-slate-600'
                              }`}>
                                {isChecked && <Icon name="check" className="w-4 h-4" />}
                              </div>
                              <span className={`text-slate-200 font-medium ${opt.isArabic ? 'arabic-font text-xl' : 'text-sm'}`}>
                                {opt.text}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {/* 3. ISIAN SINGKAT (SHORT_ANSWER) */}
                    {currentQuestion.type === 'short_answer' && (
                      <div className="space-y-2">
                        <label className="text-xs text-slate-400">Ketikkan jawaban singkat Anda:</label>
                        <input
                          type="text"
                          dir="auto"
                          value={userAnswers[currentQuestion.id] || ''}
                          onChange={(e) => handleAnswerChange(currentQuestion.id, e.target.value)}
                          placeholder="Tulis jawaban di sini..."
                          className="w-full bg-slate-950 border border-slate-700 focus:border-cyan-400 rounded-xl p-4 text-white font-medium outline-none text-lg"
                        />
                      </div>
                    )}

                    {/* 4. SOAL ESAI (ESSAY) */}
                    {currentQuestion.type === 'essay' && (
                      <div className="space-y-2">
                        <label className="text-xs text-slate-400">Tuliskan uraian jawaban lengkap Anda:</label>
                        <textarea
                          rows="5"
                          dir="auto"
                          value={userAnswers[currentQuestion.id] || ''}
                          onChange={(e) => handleAnswerChange(currentQuestion.id, e.target.value)}
                          placeholder="Ketik uraian jawaban Anda secara jelas..."
                          className="w-full bg-slate-950 border border-slate-700 focus:border-cyan-400 rounded-xl p-4 text-white font-medium outline-none leading-relaxed"
                        ></textarea>
                      </div>
                    )}

                    {/* 5. MENJODOHKAN (MATCHING) */}
                    {currentQuestion.type === 'matching' && (
                      <div className="space-y-4">
                        <p className="text-xs text-slate-400">Pilih pasangan yang paling sesuai untuk setiap pernyataan berikut:</p>
                        <div className="space-y-3">
                          {currentQuestion.premises.map((prem, idx) => {
                            const currentMatch = (userAnswers[currentQuestion.id] || {})[idx] || '';
                            return (
                              <div key={prem.id} className="bg-slate-950/60 border border-slate-800 p-3.5 rounded-2xl grid grid-cols-1 md:grid-cols-12 gap-3 items-center">
                                <div className={`md:col-span-7 text-slate-200 font-medium ${prem.isArabic ? 'arabic-font text-lg' : 'text-sm'}`}>
                                  <span className="text-cyan-400 font-bold mr-2">{idx + 1}.</span>
                                  {prem.text}
                                </div>
                                <div className="md:col-span-5">
                                  <select
                                    value={currentMatch}
                                    onChange={(e) => {
                                      const prevMatches = userAnswers[currentQuestion.id] || {};
                                      handleAnswerChange(currentQuestion.id, {
                                        ...prevMatches,
                                        [idx]: e.target.value
                                      });
                                    }}
                                    className="w-full bg-slate-900 border border-slate-700 focus:border-cyan-400 text-cyan-300 rounded-xl p-2.5 text-sm font-semibold outline-none"
                                  >
                                    <option value="">-- Pilih Pasangan --</option>
                                    {currentQuestion.targetOptions.map((opt) => (
                                      <option key={opt.key} value={opt.key}>
                                        {opt.key}. {opt.text}
                                      </option>
                                    ))}
                                  </select>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    )}

                  </div>
                </div>
              )}

              {/* NAVIGATION BUTTONS */}
              <div className="flex items-center justify-between border-t border-slate-800 pt-5 mt-6">
                <button
                  disabled={currentIndex === 0}
                  onClick={() => setCurrentIndex((prev) => prev - 1)}
                  className={`px-5 py-2.5 rounded-xl font-bold text-sm flex items-center space-x-2 transition-all ${
                    currentIndex === 0
                      ? 'opacity-40 cursor-not-allowed bg-slate-800 text-slate-500'
                      : 'bg-slate-800 hover:bg-slate-700 text-slate-200'
                  }`}
                >
                  <Icon name="left" className="w-4 h-4" />
                  <span>Sebelumnya</span>
                </button>

                {currentIndex === preparedQuestions.length - 1 ? (
                  <button
                    onClick={() => setShowConfirmModal(true)}
                    className="px-6 py-2.5 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-slate-950 font-black text-sm rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center space-x-2"
                  >
                    <Icon name="check" className="w-5 h-5" />
                    <span>Selesai & Kumpulkan</span>
                  </button>
                ) : (
                  <button
                    onClick={() => setCurrentIndex((prev) => prev + 1)}
                    className="px-6 py-2.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-black text-sm rounded-xl shadow-lg transition-all transform active:scale-95 flex items-center space-x-2"
                  >
                    <span>Selanjutnya</span>
                    <Icon name="right" className="w-4 h-4" />
                  </button>
                )}
              </div>
            </div>

            {/* RIGHT SIDE: QUESTION NUMBER GRID NAVIGATION */}
            <div className="bg-slate-900/80 backdrop-blur-md border border-slate-800 rounded-3xl p-6 flex flex-col justify-between shadow-xl h-fit">
              <div>
                <div className="flex items-center justify-between border-b border-slate-800 pb-3 mb-4">
                  <h3 className="text-sm font-bold text-slate-200 flex items-center space-x-2">
                    <Icon name="grid" className="w-4 h-4 text-cyan-400" />
                    <span>Navigasi Nomor Soal</span>
                  </h3>
                  <span className="text-xs text-slate-400">
                    Total: {preparedQuestions.length}
                  </span>
                </div>

                {/* GRID BUTTONS */}
                <div className="grid grid-cols-5 gap-2.5 max-h-80 overflow-y-auto pr-1">
                  {preparedQuestions.map((q, idx) => {
                    const ans = userAnswers[q.id];
                    let isAnswered = false;

                    if (q.type === 'mc' || q.type === 'short_answer' || q.type === 'essay') {
                      isAnswered = ans !== undefined && ans !== '';
                    } else if (q.type === 'complex') {
                      isAnswered = Array.isArray(ans) && ans.length > 0;
                    } else if (q.type === 'matching') {
                      const matchObj = ans || {};
                      isAnswered = Object.keys(matchObj).length === q.premises.length && Object.values(matchObj).every(v => v !== '');
                    }

                    const isActive = idx === currentIndex;

                    return (
                      <button
                        key={q.id}
                        onClick={() => setCurrentIndex(idx)}
                        className={`h-11 rounded-xl font-bold text-sm transition-all flex items-center justify-center ${
                          isActive ? 'ring-2 ring-cyan-400 ring-offset-2 ring-offset-slate-900' : ''
                        } ${
                          isAnswered
                            ? 'bg-emerald-600 hover:bg-emerald-500 text-white shadow-md'
                            : 'bg-slate-800 hover:bg-slate-700 text-slate-300'
                        }`}
                      >
                        {idx + 1}
                      </button>
                    );
                  })}
                </div>
              </div>

              {/* LEGEND INFO */}
              <div className="border-t border-slate-800 pt-4 mt-6 space-y-2 text-xs text-slate-400">
                <div className="flex items-center space-x-2">
                  <span className="w-3.5 h-3.5 bg-emerald-600 rounded-md"></span>
                  <span>Sudah Dijawab</span>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="w-3.5 h-3.5 bg-slate-800 rounded-md border border-slate-700"></span>
                  <span>Belum Dijawab</span>
                </div>
                <div className="flex items-center space-x-2">
                  <span className="w-3.5 h-3.5 border-2 border-cyan-400 rounded-md"></span>
                  <span>Sedang Dibuka</span>
                </div>
              </div>
            </div>

          </main>

          {/* CUSTOM MODAL: WARNING PELANGGARAN */}
          <CustomModal
            isOpen={showViolationModal}
            title="Peringatan Keamanan!"
            type="warning"
            actions={
              <button
                onClick={() => setShowViolationModal(false)}
                className="px-5 py-2.5 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-xl text-sm"
              >
                Saya Mengerti & Lanjutkan Ujian
              </button>
            }
          >
            Terdeteksi aktivitas keluar dari mode ujian / berpindah jendela browser (Pelanggaran ke-1). Jika terjadi pelanggaran sekali lagi, lembar ujian akan <b>otomatis dikunci dan disubmit</b>.
          </CustomModal>

          {/* CUSTOM MODAL: KONFIRMASI SUBMIT */}
          <CustomModal
            isOpen={showConfirmModal}
            title="Konfirmasi Pengumpulan"
            type="info"
            actions={
              <>
                <button
                  onClick={() => setShowConfirmModal(false)}
                  className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold rounded-xl text-sm"
                >
                  Periksa Lagi
                </button>
                <button
                  disabled={isSubmitting}
                  onClick={() => submitExam('Selesai Tepat Waktu')}
                  className="px-5 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-xl text-sm"
                >
                  {isSubmitting ? 'Mengirim...' : 'Ya, Kumpulkan Now'}
                </button>
              </>
            }
          >
            Apakah Anda yakin ingin mengakhiri dan mengumpulkan seluruh lembar jawaban ini? Pastikan Anda telah memeriksa jawaban secara menyeluruh.
          </CustomModal>
        </div>
      );
    }

    // Render App React 18 Root
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>

            const [currentIndex, setCurrentIndex] = useState(0);
            const [timeLeft, setTimeLeft] = useState(DURASI_MENIT * 60);
            const [violations, setViolations] = useState(0);
            const [modal, setModal] = useState({ show: false, type: '', message: '' }); // type: alert, confirm, loading
            const [score, setScore] = useState(0);

            // Refs for Anti-Cheat & Timers
            const timerRef = useRef(null);
            const stateRef = useRef({ violations: 0, view: 'login' });

            // Update ref
            useEffect(() => {
                stateRef.current = { violations, view };
            }, [violations, view]);

            // INIT EXAM
            const startNewExam = () => {
                const shuffled = shuffleArray(rawQuestionsData).map(q => {
                    if (q.type === 'mc' || q.type === 'complex') {
                        return { ...q, options: shuffleArray(q.options) };
                    }
                    if (q.type === 'matching') {
                        return { ...q, pasangan: shuffleArray(q.pasangan) };
                    }
                    return q;
                });
                setQuestions(shuffled);
                setAnswers({});
                setTimeLeft(DURASI_MENIT * 60);
                setViolations(0);
                setCurrentIndex(0);
                enterFullscreen();
                setView('exam');
            };

            const resumeExam = (savedData) => {
                setStudent(savedData.student);
                setQuestions(savedData.questions);
                setAnswers(savedData.answers);
                setTimeLeft(savedData.timeLeft);
                setViolations(savedData.violations);
                setCurrentIndex(savedData.currentIndex);
                enterFullscreen();
                setView('exam');
            };

            // AUTO SAVE
            useEffect(() => {
                if (view === 'exam') {
                    const dataToSave = { student, questions, answers, timeLeft, violations, currentIndex };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(dataToSave));
                }
            }, [answers, timeLeft, currentIndex, view]);

            // TIMER
            useEffect(() => {
                if (view === 'exam') {
                    timerRef.current = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timerRef.current);
                                handleAutoSubmit("WAKTU HABIS");
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timerRef.current);
            }, [view]);

            // ANTI CHEAT LISTENERS
            useEffect(() => {
                const handleVisibility = () => {
                    if (document.hidden && stateRef.current.view === 'exam') {
                        triggerViolation("Terdeteksi berpindah tab/aplikasi!");
                    }
                };
                const handleFullscreen = () => {
                    if (!document.fullscreenElement && stateRef.current.view === 'exam') {
                        triggerViolation("Terdeteksi keluar dari mode layar penuh (Fullscreen)!");
                    }
                };
                const handleContext = (e) => { if(stateRef.current.view === 'exam') e.preventDefault(); };

                document.addEventListener('visibilitychange', handleVisibility);
                document.addEventListener('fullscreenchange', handleFullscreen);
                document.addEventListener('contextmenu', handleContext);

                return () => {
                    document.removeEventListener('visibilitychange', handleVisibility);
                    document.removeEventListener('fullscreenchange', handleFullscreen);
                    document.removeEventListener('contextmenu', handleContext);
                };
            }, []);

            const triggerViolation = (msg) => {
                const currentViolations = stateRef.current.violations + 1;
                setViolations(currentViolations);
                
                if (currentViolations >= 2) {
                    setModal({ show: true, type: 'alert', message: 'PELANGGARAN FATAL! Ujian Anda dihentikan paksa dan disubmit otomatis.' });
                    setTimeout(() => { handleAutoSubmit("Dihentikan Paksa: " + msg); }, 3000);
                } else {
                    setModal({ show: true, type: 'alert', message: `PERINGATAN 1: ${msg} Jika diulangi, ujian akan otomatis disubmit.` });
                    // Try to re-enter fullscreen
                    setTimeout(enterFullscreen, 1000);
                }
            };

            const enterFullscreen = () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(err => console.log(err));
                }
            };

            // SUBMISSION LOGIC
            const handleAutoSubmit = (ket = "Selesai Normal") => {
                setModal({ show: true, type: 'loading', message: 'Sedang memproses dan mengirim jawaban...' });
                
                // Calculate Score & Details
                let totalSkor = 0;
                let maxSkor = questions.length; // Default 1 point per question
                let rincianArr = [];
                let esaiArr = [];

                questions.forEach(q => {
                    const ans = answers[q.id];
                    if (q.type === 'mc') {
                        if (ans === q.answer) {
                            totalSkor++;
                            rincianArr.push(`Soal ${q.id}: BENAR`);
                        } else {
                            rincianArr.push(`Soal ${q.id}: SALAH (Pilih: ${ans || '-'}, Kunci: ${q.answer})`);
                        }
                    } else if (q.type === 'essay' || q.type === 'short_answer') {
                        const txtAns = ans ? ans.replace(/\n/g, ' ') : '';
                        esaiArr.push(`Soal ${q.id}: ${txtAns}`);
                        rincianArr.push(`Soal ${q.id} (Esai/Isian): ${txtAns}`);
                    } else if (q.type === 'matching') {
                        let barisBenar = 0;
                        let detailMatch = [];
                        q.premis.forEach(p => {
                            const pAns = ans ? ans[p.id] : null;
                            const keyAns = q.answer[p.id];
                            if (pAns === keyAns) {
                                barisBenar++;
                                detailMatch.push(`${p.id}=${pAns} (BENAR)`);
                            } else {
                                detailMatch.push(`${p.id}=${pAns || '-'} (SALAH, K: ${keyAns})`);
                            }
                        });
                        const poinSoal = barisBenar / q.premis.length;
                        totalSkor += poinSoal;
                        rincianArr.push(`Soal ${q.id} (Menjodohkan): [${detailMatch.join(' | ')}]`);
                    }
                });

                const finalScore = Math.round((totalSkor / maxSkor) * 100);
                setScore(finalScore);

                const payload = {
                    waktu: new Date().toLocaleString('id-ID'),
                    nama: student.name,
                    kelas: student.kelas,
                    tanggal: student.date,
                    nilai: finalScore,
                    esai: esaiArr.join('\n'),
                    pelanggaran: violations,
                    keterangan: ket,
                    rincian: rincianArr.join(' | ')
                };

                // Fetch POST Google Sheets
                fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                }).then(() => {
                    localStorage.removeItem(STORAGE_KEY);
                    setView('result');
                    setModal({ show: false });
                    if(document.fullscreenElement) document.exitFullscreen();
                }).catch(err => {
                    alert("Koneksi gagal. Jawaban tersimpan di LocalStorage.");
                    setModal({ show: false });
                });
            };

            // RENDERERS
            if (view === 'login') {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    return (
                        <div className="flex items-center justify-center min-h-screen p-4">
                            <div className="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full text-center">
                                <h2 className="text-2xl font-bold mb-4 text-slate-800">Sesi Ujian Tersimpan!</h2>
                                <p className="text-slate-600 mb-6">Kami menemukan sesi ujian yang belum selesai atas nama Anda. Apakah Anda ingin melanjutkan?</p>
                                <div className="space-y-3">
                                    <button onClick={() => resumeExam(JSON.parse(saved))} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition">Lanjutkan Ujian</button>
                                    <button onClick={() => { localStorage.removeItem(STORAGE_KEY); setView('login'); }} className="w-full bg-red-100 hover:bg-red-200 text-red-700 font-bold py-3 px-4 rounded-lg transition">Hapus & Mulai Baru</button>
                                </div>
                            </div>
                        </div>
                    );
                }

                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white p-8 rounded-xl shadow-2xl max-w-md w-full">
                            <div className="text-center mb-8">
                                <h1 className="text-3xl font-extrabold text-blue-900 mb-2">{MAPEL}</h1>
                                <p className="text-slate-500 font-medium">{JENIS_UJIAN} - KELAS {KELAS}</p>
                            </div>
                            <form onSubmit={(e) => { e.preventDefault(); startNewExam(); }} className="space-y-5">
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">Nama Lengkap</label>
                                    <input required type="text" className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={student.name} onChange={e => setStudent({...student, name: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">Kelas</label>
                                    <input required type="text" className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={student.kelas} onChange={e => setStudent({...student, kelas: e.target.value})} />
                                </div>
                                <div>
                                    <label className="block text-sm font-bold text-slate-700 mb-1">Tanggal Ujian</label>
                                    <input required type="date" className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" value={student.date} onChange={e => setStudent({...student, date: e.target.value})} />
                                </div>
                                <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 px-4 rounded-lg shadow-lg transition mt-4">MULAI UJIAN</button>
                            </form>
                        </div>
                    </div>
                );
            }

            if (view === 'result') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white p-10 rounded-xl shadow-2xl max-w-lg w-full text-center">
                            <div className="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                                <svg className="w-12 h-12 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                            </div>
                            <h2 className="text-3xl font-bold text-slate-800 mb-2">Ujian Selesai!</h2>
                            <p className="text-slate-600 mb-6">Data jawaban Anda telah berhasil dikirim ke server.</p>
                            <div className="bg-slate-50 p-4 rounded-lg border">
                                <p className="text-sm text-slate-500">Nama: <strong className="text-slate-800">{student.name}</strong></p>
                                <p className="text-sm text-slate-500">Nilai Akhir (Sistem): <strong className="text-xl text-blue-600 ml-2">{score}</strong></p>
                            </div>
                        </div>
                    </div>
                );
            }

            // EXAM VIEW
            const currentQ = questions[currentIndex];
            const m = Math.floor(timeLeft / 60).toString().padStart(2, '0');
            const s = (timeLeft % 60).toString().padStart(2, '0');

            return (
                <div className="flex flex-col h-screen exam-active bg-slate-50">
                    {/* Header */}
                    <header className="bg-white shadow-sm px-6 py-4 flex justify-between items-center z-10 shrink-0">
                        <div>
                            <h1 className="text-xl font-bold text-blue-900">{MAPEL}</h1>
                            <p className="text-xs text-slate-500">{JENIS_UJIAN} | {student.name}</p>
                        </div>
                        <div className="flex items-center gap-4">
                            <div className={`font-mono text-xl font-bold px-4 py-1 rounded border ${timeLeft < 300 ? 'bg-red-100 text-red-700 border-red-200 animate-pulse' : 'bg-blue-50 text-blue-700 border-blue-200'}`}>
                                {m}:{s}
                            </div>
                        </div>
                    </header>

                    {/* Main Content */}
                    <div className="flex flex-1 overflow-hidden">
                        {/* Question Area */}
                        <main className="flex-1 overflow-y-auto p-6 md:p-10">
                            <div className="max-w-4xl mx-auto bg-white rounded-xl shadow-sm border p-6 md:p-8">
                                <div className="mb-6 flex gap-4 border-b pb-4">
                                    <div className="w-10 h-10 shrink-0 bg-blue-100 text-blue-800 font-bold rounded-full flex items-center justify-center text-lg">
                                        {currentIndex + 1}
                                    </div>
                                    <div className="w-full">
                                        {currentQ.image && (
                                            <img src={currentQ.image} alt="Soal" className="max-w-full h-auto rounded mb-4 border" />
                                        )}
                                        <div className={`text-lg text-slate-800 ${currentQ.isArabText ? 'arab-text' : ''}`} dangerouslySetInnerHTML={{__html: currentQ.text}}></div>
                                    </div>
                                </div>

                                {/* Options Wrapper */}
                                <div className="pl-14">
                                    {currentQ.type === 'mc' && (
                                        <div className={currentQ.options.some(o => o.image) ? "grid grid-cols-1 md:grid-cols-2 gap-4" : "space-y-3"}>
                                            {currentQ.options.map(opt => (
                                                <label key={opt.id} className={`flex items-start p-4 border rounded-lg cursor-pointer transition ${answers[currentQ.id] === opt.id ? 'border-blue-500 bg-blue-50 shadow-sm' : 'hover:bg-slate-50'}`}>
                                                    <input 
                                                        type="radio" 
                                                        name={`q_${currentQ.id}`} 
                                                        className="mt-1 w-5 h-5 text-blue-600 shrink-0" 
                                                        checked={answers[currentQ.id] === opt.id}
                                                        onChange={() => setAnswers({...answers, [currentQ.id]: opt.id})}
                                                    />
                                                    <div className="ml-3 w-full">
                                                        {opt.image ? (
                                                            <img src={opt.image} alt="Opsi" className="w-full h-auto rounded" />
                                                        ) : (
                                                            <span className={`block w-full ${opt.isArab ? 'arab-text' : ''}`}>{opt.text}</span>
                                                        )}
                                                    </div>
                                                </label>
                                            ))}
                                        </div>
                                    )}

                                    {currentQ.type === 'matching' && (
                                        <div className="space-y-4">
                                            {currentQ.premis.map(p => (
                                                <div key={p.id} className="flex flex-col md:flex-row md:items-center gap-4 bg-slate-50 p-4 rounded border">
                                                    <div className={`flex-1 ${p.isArab ? 'arab-text' : ''}`}>{p.text}</div>
                                                    <div className="shrink-0 w-full md:w-64">
                                                        <select 
                                                            className="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-blue-500"
                                                            value={(answers[currentQ.id] && answers[currentQ.id][p.id]) || ""}
                                                            onChange={(e) => {
                                                                const newAns = {...(answers[currentQ.id] || {})};
                                                                newAns[p.id] = e.target.value;
                                                                setAnswers({...answers, [currentQ.id]: newAns});
                                                            }}
                                                        >
                                                            <option value="" disabled>-- Pilih Pasangan --</option>
                                                            {currentQ.pasangan.map(pas => (
                                                                <option key={pas.id} value={pas.id}>{pas.text}</option>
                                                            ))}
                                                        </select>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}

                                    {currentQ.type === 'essay' && (
                                        <textarea 
                                            rows="5" 
                                            className="w-full p-4 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500 arab-text"
                                            placeholder="Ketik jawaban Anda di sini..."
                                            value={answers[currentQ.id] || ""}
                                            onChange={(e) => setAnswers({...answers, [currentQ.id]: e.target.value})}
                                        ></textarea>
                                    )}
                                </div>

                                {/* Controls */}
                                <div className="mt-10 flex justify-between items-center pt-6 border-t">
                                    <button 
                                        onClick={() => setCurrentIndex(prev => Math.max(0, prev - 1))}
                                        disabled={currentIndex === 0}
                                        className="px-6 py-2 border rounded-lg font-medium text-slate-600 hover:bg-slate-50 disabled:opacity-50"
                                    >
                                        &larr; Sebelumnya
                                    </button>
                                    
                                    {currentIndex === questions.length - 1 ? (
                                        <button 
                                            onClick={() => setModal({ show: true, type: 'confirm', message: 'Apakah Anda yakin ingin mengumpulkan ujian ini? Pastikan semua soal telah terjawab.'})}
                                            className="px-6 py-2 bg-green-600 hover:bg-green-700 text-white font-bold rounded-lg shadow"
                                        >
                                            Selesai & Kumpulkan
                                        </button>
                                    ) : (
                                        <button 
                                            onClick={() => setCurrentIndex(prev => Math.min(questions.length - 1, prev + 1))}
                                            className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg shadow"
                                        >
                                            Selanjutnya &rarr;
                                        </button>
                                    )}
                                </div>
                            </div>
                        </main>

                        {/* Navigation Grid */}
                        <aside className="w-80 bg-white border-l flex flex-col shrink-0">
                            <div className="p-4 border-b bg-slate-50 font-bold text-slate-700 text-center">Navigasi Soal</div>
                            <div className="p-4 overflow-y-auto flex-1">
                                <div className="grid grid-cols-5 gap-2">
                                    {questions.map((q, idx) => {
                                        let isAnswered = false;
                                        if (q.type === 'mc' || q.type === 'essay') {
                                            isAnswered = !!answers[q.id];
                                        } else if (q.type === 'matching') {
                                            isAnswered = answers[q.id] && Object.keys(answers[q.id]).length === q.premis.length;
                                        }

                                        return (
                                            <button 
                                                key={q.id}
                                                onClick={() => setCurrentIndex(idx)}
                                                className={`w-full aspect-square rounded flex items-center justify-center font-bold border-2 transition-all 
                                                    ${isAnswered ? 'bg-green-500 text-white border-green-600' : 'bg-white text-slate-600 border-slate-200'}
                                                    ${currentIndex === idx ? 'ring-4 ring-blue-300 ring-offset-1 border-blue-600 scale-105' : 'hover:bg-slate-100'}`}
                                            >
                                                {idx + 1}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                            <div className="p-4 border-t bg-slate-50 text-xs text-slate-500 space-y-2">
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-green-500 rounded"></div> Sudah Dijawab</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 bg-white border rounded"></div> Belum Dijawab</div>
                                <div className="flex items-center gap-2"><div className="w-3 h-3 border-2 border-blue-600 rounded"></div> Posisi Saat Ini</div>
                            </div>
                        </aside>
                    </div>

                    {/* Modals (Alert / Confirm / Loading) */}
                    {modal.show && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center backdrop-blur-sm bg-black/60">
                            <div className="bg-white p-6 rounded-xl shadow-2xl max-w-sm w-full text-center">
                                {modal.type === 'loading' ? (
                                    <div className="py-6">
                                        <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-600 mx-auto mb-4"></div>
                                        <p className="text-slate-700 font-medium">{modal.message}</p>
                                    </div>
                                ) : (
                                    <>
                                        <div className="flex justify-center mb-4">
                                            {modal.type === 'alert' ? <IconAlert /> : <div className="text-4xl">🤔</div>}
                                        </div>
                                        <h3 className={`text-xl font-bold mb-2 ${modal.type==='alert'?'text-red-600':'text-slate-800'}`}>
                                            {modal.type === 'alert' ? 'PERINGATAN' : 'Konfirmasi'}
                                        </h3>
                                        <p className="text-slate-600 mb-6">{modal.message}</p>
                                        <div className="flex gap-3 justify-center">
                                            {modal.type === 'confirm' && (
                                                <button onClick={() => setModal({show:false})} className="px-4 py-2 border rounded-lg font-medium text-slate-600 hover:bg-slate-50">Batal</button>
                                            )}
                                            <button 
                                                onClick={() => {
                                                    if(modal.type === 'confirm' || modal.message.includes('FATAL')) handleAutoSubmit();
                                                    else setModal({show:false});
                                                }} 
                                                className={`px-4 py-2 rounded-lg font-bold text-white ${modal.type==='alert' ? 'bg-red-600 hover:bg-red-700' : 'bg-blue-600 hover:bg-blue-700'}`}
                                            >
                                                {modal.type === 'alert' ? 'Mengerti' : 'Ya, Kumpulkan'}
                                            </button>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

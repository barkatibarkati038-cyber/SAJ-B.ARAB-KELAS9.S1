        // ==========================================
        // KOMPONEN UTAMA
        // ==========================================
        const App = () => {
            const [step, setStep] = useState('init'); // init, login, active, submitting, result
            const [userData, setUserData] = useState({ nama: '', kelas: '', tanggal: new Date().toISOString().substr(0, 10) });
            const [questions, setQuestions] = useState([]);
            const [answers, setAnswers] = useState({});
            const [currentQ, setCurrentQ] = useState(0);
            const [timeRemaining, setTimeRemaining] = useState(DURASI_MENIT * 60);
            const [violations, setViolations] = useState(0);
            const [modal, setModal] = useState({ show: false, type: '', message: '' });
            const [finalScore, setFinalScore] = useState(0);

            // Cek recovery
            useEffect(() => {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    setUserData(parsed.userData);
                    setQuestions(parsed.questions);
                    setAnswers(parsed.answers || {});
                    setTimeRemaining(parsed.timeRemaining);
                    setViolations(parsed.violations || 0);
                    setStep('recovery');
                } else {
                    setStep('login');
                }
            }, []);

            // Save to LocalStorage real-time
            useEffect(() => {
                if (step === 'active') {
                    const data = { userData, questions, answers, timeRemaining, violations };
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
                }
            }, [step, answers, timeRemaining, violations, questions]);

            // Timer Tick
            useEffect(() => {
                let timer;
                if (step === 'active' && timeRemaining > 0) {
                    timer = setInterval(() => setTimeRemaining(prev => prev - 1), 1000);
                } else if (step === 'active' && timeRemaining <= 0) {
                    handleSubmit(true);
                }
                return () => clearInterval(timer);
            }, [step, timeRemaining]);

            // Anti-Cheat: Events
            useEffect(() => {
                if (step !== 'active') return;

                const handleCopyPaste = (e) => e.preventDefault();
                const handleContextMenu = (e) => e.preventDefault();

                const handleVisibility = () => {
                    if (document.hidden) registerViolation();
                };

                const handleFullscreen = () => {
                    if (!document.fullscreenElement) registerViolation();
                };

                document.addEventListener('copy', handleCopyPaste);
                document.addEventListener('paste', handleCopyPaste);
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('visibilitychange', handleVisibility);
                document.addEventListener('fullscreenchange', handleFullscreen);

                return () => {
                    document.removeEventListener('copy', handleCopyPaste);
                    document.removeEventListener('paste', handleCopyPaste);
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('visibilitychange', handleVisibility);
                    document.removeEventListener('fullscreenchange', handleFullscreen);
                };
            }, [step, violations]);

            const registerViolation = () => {
                const newV = violations + 1;
                setViolations(newV);
                if (newV >= 2) {
                    setModal({ show: true, type: 'cheat_fatal', message: 'Anda telah keluar dari aplikasi 2 kali. Ujian dihentikan dan disubmit secara otomatis.' });
                    setTimeout(() => handleSubmit(true), 3000);
                } else {
                    setModal({ show: true, type: 'cheat_warning', message: 'Peringatan ke-1: Anda terdeteksi keluar dari layar ujian. Jika mengulangi, ujian akan otomatis disubmit!' });
                }
            };

            const startNewExam = () => {
                // Shuffle questions and options
                let shuf = shuffleArray(rawQuestionsData).map(q => {
                    if (q.options) return { ...q, options: shuffleArray(q.options) };
                    if (q.targets) return { ...q, targets: shuffleArray(q.targets) };
                    return q;
                });
                setQuestions(shuf);
                setAnswers({});
                setTimeRemaining(DURASI_MENIT * 60);
                setViolations(0);
                setStep('active');
                requestFullscreen();
            };

            const requestFullscreen = () => {
                const elem = document.documentElement;
                if (elem.requestFullscreen) elem.requestFullscreen().catch(()=>{});
                else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen().catch(()=>{});
            };

            const clearRecovery = () => {
                localStorage.removeItem(STORAGE_KEY);
                setStep('login');
                setUserData({ nama: '', kelas: '', tanggal: new Date().toISOString().substr(0, 10) });
            };

            const handleAnswerChange = (qId, val, isMatching = false, matchPremiseId = null) => {
                if (isMatching) {
                    setAnswers(prev => ({
                        ...prev,
                        [qId]: { ...(prev[qId] || {}), [matchPremiseId]: val }
                    }));
                } else {
                    setAnswers(prev => ({ ...prev, [qId]: val }));
                }
            };

            const isQuestionAnswered = (q) => {
                if (!answers[q.id]) return false;
                if (q.type === 'matching') {
                    return Object.keys(answers[q.id]).length === q.premises.length;
                }
                if (q.type === 'complex') {
                    return answers[q.id].length > 0;
                }
                return String(answers[q.id]).trim().length > 0;
            };

            // Calculate Score and generate detailed JSON
            const handleSubmit = async (isForced = false) => {
                setModal({ show: false, type: '', message: '' });
                setStep('submitting');
                if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});

                let totalCorrectWeight = 0;
                const totalItemsWeight = rawQuestionsData.length; // Simplified: each main question is 1 point weight
                
                let rincianArr = [];
                let esaiArr = [];

                // Grade strictly based on rawQuestionsData (original order/keys)
                rawQuestionsData.forEach((origQ) => {
                    const jwb = answers[origQ.id];
                    
                    if (!jwb || (typeof jwb === 'object' && Object.keys(jwb).length===0)) {
                        rincianArr.push(`Soal ${origQ.id}: KOSONG`);
                        return;
                    }

                    if (origQ.type === 'mc') {
                        if (jwb === origQ.answer) {
                            totalCorrectWeight += 1;
                            rincianArr.push(`Soal ${origQ.id}: BENAR`);
                        } else {
                            rincianArr.push(`Soal ${origQ.id}: SALAH (Jawab: ${jwb}, Kunci: ${origQ.answer})`);
                        }
                    } 
                    else if (origQ.type === 'matching') {
                        let correctRows = 0;
                        let matchDetails = [];
                        origQ.premises.forEach(p => {
                            const pId = p.id;
                            const studentAns = jwb[pId];
                            const correctAns = origQ.pairs[pId];
                            if (studentAns === correctAns) {
                                correctRows += 1;
                                matchDetails.push(`[${pId}=BENAR]`);
                            } else {
                                matchDetails.push(`[${pId}=SALAH(Kunci:${correctAns})]`);
                            }
                        });
                        const qScore = correctRows / origQ.premises.length;
                        totalCorrectWeight += qScore;
                        rincianArr.push(`Soal ${origQ.id} (Menjodohkan): ${matchDetails.join(' | ')}`);
                    }
                    else if (origQ.type === 'essay' || origQ.type === 'short_answer') {
                        const cleanJwb = String(jwb).replace(/\n/g, ' ');
                        esaiArr.push(`Soal ${origQ.id}: ${cleanJwb}`);
                        rincianArr.push(`Soal ${origQ.id} (${origQ.type}): ${cleanJwb}`);
                        // manual grading for essays, auto 0 for now.
                    }
                    else if (origQ.type === 'complex') {
                        const isCorrect = Array.isArray(jwb) && jwb.length === origQ.answer.length && jwb.every(v => origQ.answer.includes(v));
                        if(isCorrect) totalCorrectWeight += 1;
                        rincianArr.push(`Soal ${origQ.id}: ${isCorrect ? 'BENAR' : 'SALAH'}`);
                    }
                });

                const finalSkorNum = Math.round((totalCorrectWeight / totalItemsWeight) * 100);
                setFinalScore(finalSkorNum);

                const payload = {
                    nama: userData.nama,
                    kelas: userData.kelas,
                    tanggal: userData.tanggal,
                    skor: finalSkorNum,
                    pelanggaran: violations,
                    keterangan: isForced ? 'Auto-Submit (Waktu Habis/Pelanggaran)' : 'Selesai Normal',
                    jawabanEsai: esaiArr.join('\n\n'),
                    rincianJawaban: rincianArr.join(' | ')
                };

                try {
                    await fetch(GOOGLE_SHEETS_WEB_APP_URL, {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'text/plain' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {
                    console.error("Gagal mengirim data", e);
                }

                localStorage.removeItem(STORAGE_KEY);
                setStep('result');
            };

            // RENDER LOGIC
            if (step === 'init') return <div className="text-white text-center mt-20">Memuat...</div>;

            if (step === 'login' || step === 'recovery') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-8">
                            <h1 className="text-3xl font-bold text-center text-cyan-600 mb-2">{MAPEL}</h1>
                            <p className="text-center text-gray-500 text-sm mb-6">{JENIS_UJIAN} - Kelas {KELAS}</p>
                            
                            {step === 'recovery' ? (
                                <div className="text-center">
                                    <div className="bg-yellow-100 text-yellow-800 p-4 rounded-lg mb-6 text-sm font-semibold">
                                        ⚠️ Sesi Ujian Tersimpan Ditemukan!
                                    </div>
                                    <button onClick={() => { setStep('active'); requestFullscreen(); }} className="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 rounded-lg mb-3 transition">
                                        Lanjutkan Ujian
                                    </button>
                                    <button onClick={clearRecovery} className="w-full bg-red-100 hover:bg-red-200 text-red-600 font-bold py-3 rounded-lg transition">
                                        Mulai Ulang (Hapus Progres)
                                    </button>
                                </div>
                            ) : (
                                <form onSubmit={(e) => { e.preventDefault(); startNewExam(); }}>
                                    <div className="mb-4">
                                        <label className="block text-gray-700 font-semibold mb-2">Nama Lengkap</label>
                                        <input required type="text" className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none" value={userData.nama} onChange={e=>setUserData({...userData, nama: e.target.value})} />
                                    </div>
                                    <div className="mb-4">
                                        <label className="block text-gray-700 font-semibold mb-2">Kelas</label>
                                        <input required type="text" className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none" value={userData.kelas} onChange={e=>setUserData({...userData, kelas: e.target.value})} />
                                    </div>
                                    <div className="mb-6">
                                        <label className="block text-gray-700 font-semibold mb-2">Tanggal Ujian</label>
                                        <input required type="date" className="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-cyan-500 outline-none" value={userData.tanggal} onChange={e=>setUserData({...userData, tanggal: e.target.value})} />
                                    </div>
                                    <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-700 text-white font-bold py-3 rounded-lg transition shadow-lg">
                                        Mulai Ujian
                                    </button>
                                </form>
                            )}
                        </div>
                    </div>
                );
            }

            if (step === 'submitting') {
                return <div className="flex items-center justify-center min-h-screen text-white text-2xl font-bold">Menyimpan data...</div>;
            }

            if (step === 'result') {
                return (
                    <div className="flex items-center justify-center min-h-screen p-4">
                        <div className="bg-white rounded-2xl shadow-xl max-w-md w-full p-8 text-center">
                            <CheckIcon />
                            <h2 className="text-2xl font-bold text-gray-800 mt-4">Ujian Selesai!</h2>
                            <p className="text-gray-500 mt-2">Terima kasih, data ujian Anda telah berhasil direkam.</p>
                            <div className="bg-gray-100 rounded-lg p-6 mt-6">
                                <span className="block text-sm text-gray-500 uppercase tracking-wider">Nilai Akhir</span>
                                <span className="block text-6xl font-black text-cyan-600 mt-2">{finalScore}</span>
                            </div>
                        </div>
                    </div>
                );
            }

            // --- EXAM VIEW ---
            const q = questions[currentQ];

            return (
                <div className="flex flex-col md:flex-row min-h-screen bg-gray-50">
                    
                    {/* MODALS */}
                    {modal.show && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
                            <div className="bg-white p-8 rounded-2xl max-w-md w-full shadow-2xl text-center">
                                {modal.type.includes('cheat') ? <AlertIcon /> : null}
                                <h3 className="text-xl font-bold mt-4 mb-2 text-gray-800">
                                    {modal.type === 'confirm' ? 'Konfirmasi Kumpul' : 'Peringatan Sistem!'}
                                </h3>
                                <p className="text-gray-600 mb-6">{modal.message}</p>
                                <div className="flex gap-4 justify-center">
                                    {modal.type === 'confirm' ? (
                                        <>
                                            <button onClick={()=>setModal({show:false})} className="px-6 py-2 bg-gray-200 text-gray-800 font-bold rounded-lg">Batal</button>
                                            <button onClick={()=>handleSubmit(false)} className="px-6 py-2 bg-cyan-600 text-white font-bold rounded-lg">Ya, Kumpulkan</button>
                                        </>
                                    ) : (
                                        <button onClick={()=> modal.type === 'cheat_fatal' ? handleSubmit(true) : setModal({show:false})} className="px-6 py-2 bg-red-600 text-white font-bold rounded-lg">Mengerti</button>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MAIN AREA */}
                    <div className="flex-1 flex flex-col">
                        <header className="bg-white shadow-sm p-4 flex justify-between items-center z-10">
                            <div>
                                <h1 className="font-bold text-gray-800 text-lg md:text-xl">{MAPEL}</h1>
                                <span className="text-xs md:text-sm text-gray-500">{userData.nama} - {userData.kelas}</span>
                            </div>
                            <div className={`font-mono text-xl md:text-2xl font-bold px-4 py-1 rounded-lg ${timeRemaining < 300 ? 'bg-red-100 text-red-600' : 'bg-cyan-100 text-cyan-800'}`}>
                                {formatTime(timeRemaining)}
                            </div>
                        </header>

                        <main className="flex-1 p-4 md:p-8 overflow-y-auto">
                            <div className="bg-white rounded-xl shadow-sm p-6 md:p-10 max-w-4xl mx-auto">
                                <div className="mb-4 text-sm font-semibold text-gray-400 border-b pb-4">SOAL NOMOR {currentQ + 1}</div>
                                
                                {/* QUESTION TEXT */}
                                <div className={`text-lg md:text-xl text-gray-800 mb-6 whitespace-pre-line ${q.rtl ? 'arabic-text text-right text-2xl font-bold' : ''}`} dir={q.rtl ? 'rtl' : 'ltr'}>
                                    {q.text}
                                </div>
                                {q.image && <img src={q.image} alt="Soal" className="mb-6 max-w-full h-auto rounded border" />}

                                {/* OPTIONS / INPUTS */}
                                <div className="space-y-4">
                                    {q.type === 'mc' && q.options.map(opt => (
                                        <label key={opt.id} className={`flex ${q.rtl ? 'flex-row-reverse text-right' : 'flex-row'} items-center p-4 border rounded-xl cursor-pointer transition ${answers[q.id] === opt.id ? 'bg-cyan-50 border-cyan-500 shadow-sm' : 'hover:bg-gray-50 border-gray-200'}`}>
                                            <input type="radio" name={`q_${q.id}`} className="w-5 h-5 text-cyan-600" checked={answers[q.id] === opt.id} onChange={() => handleAnswerChange(q.id, opt.id)} />
                                            <span className={`flex-1 ${q.rtl ? 'mr-4 arabic-text text-xl' : 'ml-4'} ${opt.rtl ? 'arabic-text text-xl text-right' : ''}`} dir={opt.rtl ? 'rtl' : 'ltr'}>{opt.text}</span>
                                            {opt.image && <img src={opt.image} alt="Opsi" className="h-16 ml-4" />}
                                        </label>
                                    ))}

                                    {q.type === 'matching' && (
                                        <div className="overflow-x-auto">
                                            <table className="w-full text-left border-collapse">
                                                <tbody>
                                                    {q.premises.map((p, idx) => (
                                                        <tr key={p.id} className={idx % 2 === 0 ? 'bg-gray-50' : 'bg-white'}>
                                                            <td className={`p-4 border ${p.rtl ? 'text-right arabic-text text-xl' : ''}`} dir={p.rtl ? 'rtl' : 'ltr'}>{p.text}</td>
                                                            <td className="p-4 border w-1/2">
                                                                <select 
                                                                    className="w-full p-2 border rounded outline-none focus:ring-2 focus:ring-cyan-500" 
                                                                    value={answers[q.id]?.[p.id] || ''} 
                                                                    onChange={(e) => handleAnswerChange(q.id, e.target.value, true, p.id)}
                                                                >
                                                                    <option value="">-- Pilih Jawaban --</option>
                                                                    {q.targets.map(t => (
                                                                        <option key={t.id} value={t.id}>{t.text}</option>
                                                                    ))}
                                                                </select>
                                                            </td>
                                                        </tr>
                                                    ))}
                                                </tbody>
                                            </table>
                                        </div>
                                    )}

                                    {q.type === 'short_answer' && (
                                        <input type="text" className="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Ketik jawaban singkat Anda..." value={answers[q.id] || ''} onChange={e => handleAnswerChange(q.id, e.target.value)} />
                                    )}

                                    {q.type === 'essay' && (
                                        <textarea rows="6" className="w-full p-4 border rounded-xl outline-none focus:ring-2 focus:ring-cyan-500 resize-none" placeholder="Uraikan jawaban Anda di sini..." value={answers[q.id] || ''} onChange={e => handleAnswerChange(q.id, e.target.value)}></textarea>
                                    )}
                                </div>
                            </div>
                        </main>

                        <footer className="bg-white p-4 border-t flex justify-between items-center">
                            <button disabled={currentQ === 0} onClick={() => setCurrentQ(q => q - 1)} className="px-6 py-3 rounded-lg font-bold text-gray-700 bg-gray-200 hover:bg-gray-300 disabled:opacity-50">
                                Sebelumnya
                            </button>
                            
                            {currentQ === questions.length - 1 ? (
                                <button onClick={() => setModal({show: true, type: 'confirm', message: 'Apakah Anda yakin ingin mengumpulkan ujian ini? Periksa kembali jawaban Anda.'})} className="px-6 py-3 rounded-lg font-bold text-white bg-green-600 hover:bg-green-700 shadow-lg">
                                    Selesai & Kumpulkan
                                </button>
                            ) : (
                                <button onClick={() => setCurrentQ(q => q + 1)} className="px-6 py-3 rounded-lg font-bold text-white bg-cyan-600 hover:bg-cyan-700 shadow-lg">
                                    Selanjutnya
                                </button>
                            )}
                        </footer>
                    </div>

                    {/* NAVIGASI NOMOR SOAL */}
                    <div className="w-full md:w-80 bg-white border-l shadow-lg flex flex-col">
                        <div className="p-4 border-b font-bold text-gray-700 text-center">Navigasi Soal</div>
                        <div className="p-4 flex-1 overflow-y-auto grid grid-cols-5 gap-2 content-start">
                            {questions.map((qItem, idx) => {
                                const isAnswered = isQuestionAnswered(qItem);
                                const isActive = idx === currentQ;
                                return (
                                    <button 
                                        key={qItem.id} 
                                        onClick={() => setCurrentQ(idx)}
                                        className={`w-full aspect-square rounded font-bold text-sm transition shadow-sm border-2 
                                            ${isActive ? 'border-blue-500 scale-110 z-10' : 'border-transparent'} 
                                            ${isAnswered ? 'bg-green-500 text-white' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}
                                        `}
                                    >
                                        {idx + 1}
                                    </button>
                                );
                            })}
                        </div>
                        <div className="p-4 border-t text-sm flex gap-4 justify-center text-gray-500">
                            <span className="flex items-center"><span className="w-3 h-3 bg-green-500 rounded-full mr-2"></span>Terjawab</span>
                            <span className="flex items-center"><span className="w-3 h-3 bg-gray-200 rounded-full mr-2"></span>Kosong</span>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
